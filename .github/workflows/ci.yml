name: CI/CD

# Branch model: feature/* -> PR to develop -> PR develop -> main.
#   pull_request -> policy, PR hygiene, lint, tests (Node 20/22 + coverage), build, audit,
#                   secret scan, dependency review, Lighthouse, Vercel preview per PR
#   push develop -> same checks + Vercel preview (staging)
#   push main    -> same checks + Vercel production (approval) + GitHub Release
# Deploys are opt-in: set the repository variable VERCEL_DEPLOY=true.
# Required status check for branch protection: "CI passed".

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUNDLE_BUDGET_KB: '900'

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Only develop may be merged into main
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "develop" ]; then
            echo "::error::PRs to main must come from develop (got '$HEAD_REF'). Open this PR against develop."
            exit 1
          fi

  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert|release)(\([a-zA-Z0-9_-]+\))?!?: .+'
          if ! [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(checkout): agrega formulario (#9)'. Got: $PR_TITLE"
            exit 1
          fi
      - name: Linked issue (warning only)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<<"$PR_BODY"; then
            echo "::warning::The PR body has no 'Closes #<issue>' keyword."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Lint
        working-directory: frontend
        run: npm run lint

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests with coverage
        working-directory: frontend
        run: npm run test:ci
      - name: Coverage summary
        if: always() && matrix.node == '22'
        working-directory: frontend
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const row = (k) => '| ' + k + ' | ' + t[k].pct + '% |';
              console.log(['### Coverage', '', '| Metric | % |', '| --- | --- |', row('lines'), row('statements'), row('functions'), row('branches')].join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reports
        if: always() && matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            frontend/reports/junit.xml
            frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle budget
        working-directory: frontend
        run: |
          test -f dist/index.html
          total=$(find dist/assets -name "*.js" -exec cat {} + | wc -c)
          kb=$((total / 1024))
          echo "### Bundle size: ${kb} KB (budget ${BUNDLE_BUDGET_KB} KB)" >> "$GITHUB_STEP_SUMMARY"
          [ "$kb" -le "${BUNDLE_BUDGET_KB}" ] || { echo "::error::JS bundle ${kb} KB is over the ${BUNDLE_BUDGET_KB} KB budget"; exit 1; }
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  lighthouse:
    name: Lighthouse (non-blocking)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - name: npm audit (high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Look for committed credentials
        run: |
          if git grep -nIE "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|vercel_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36})" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Possible secret committed"; exit 1
          fi
      - name: Block committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then
            echo "::error::.env file is tracked"; exit 1
          fi

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color

  ci-passed:
    name: CI passed
    if: always()
    needs: [branch-policy, pr-hygiene, lint, test, build, security-audit, secret-scan, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"'; then
            echo "::error::One or more required jobs failed"; exit 1
          fi

  deploy-pr-preview:
    name: Preview for PR (Vercel)
    needs: ci-passed
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.VERCEL_DEPLOY == 'true'
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      production: false
    secrets: inherit

  comment-preview:
    name: Comment preview URL
    needs: deploy-pr-preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.deploy-pr-preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\nVista previa: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy-staging:
    name: Deploy staging (Vercel)
    needs: ci-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.VERCEL_DEPLOY == 'true'
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      production: false
    secrets: inherit

  deploy-production:
    name: Deploy production (Vercel)
    needs: ci-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY == 'true'
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      production: true
    secrets: inherit

  release:
    name: GitHub Release
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="release-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
