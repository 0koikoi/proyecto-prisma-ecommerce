<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-ci-title pipeline-ci-desc" id="pipeline-ci-root">
<title id="pipeline-ci-title">Pipeline de CI/CD</title>
<desc id="pipeline-ci-desc">Al abrir un pull request corren tres grupos de verificaciones en paralelo; si el check CI aprobado pasa, el PR se revisa y se despliega, y si falla el bot comenta qué revisar.</desc>
<defs>
      <style>#pipeline-ci-root { --color-paper: #f5f5f5; --color-ink: #1c1c1c; --color-muted: #4b5563; --color-accent: #0e7490;
  --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #pipeline-ci-root { font-family: var(--font-sans); color: var(--color-ink); }
      #pipeline-ci-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pipeline-ci-root .diagram-container { overflow-x: visible; }
}</style>
